services:
  homepage:
    build: .
    ports:
      # Raggiungibile dalla LAN (http://IP-DEL-PI:8081) e, tramite
      # tailscale serve, da remoto su https://<nome>.<tailnet>.ts.net (porta 443).
      - "8081:80"
    volumes:
      # Giochi caricati dalla pagina: nginx li serve in sola lettura su /giochi/caricati/
      - giochi-caricati:/usr/share/nginx/html/giochi/caricati:ro
    depends_on:
      - giochi
    networks:
      - giochi-net
    restart: unless-stopped

  # Servizio dei giochi: riceve i giochi caricati dalla pagina /giochi/ (password
  # GIOCHI_PASSWORD del file .env) e dà a ogni gioco un link pubblico per i genitori.
  giochi:
    build: ./uploader
    ports:
      # Solo i giochi tramite link: visibile solo sul Pi stesso, esce su Internet
      # dall'ingresso pubblico di Parole (percorso /g/, vedi README)
      - "127.0.0.1:8084:3001"
    environment:
      - GIOCHI_PASSWORD=${GIOCHI_PASSWORD:-}
      # Indirizzo base dei link pubblici, es. https://parole-esercizi.<tailnet>.ts.net/g
      - GIOCHI_PUBLIC_URL=${GIOCHI_PUBLIC_URL:-}
    volumes:
      - giochi-caricati:/data
      # Codici dei link: privati, fuori dalla cartella che nginx rende elencabile
      - giochi-stato:/state
      # Giochi della repo, per dare un link anche a loro
      - ./app/giochi/files:/repo:ro
    networks:
      - giochi-net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 50
    restart: unless-stopped

networks:
  # Bridge con nome fisso: le regole in firewall/ impediscono ai container di aprire
  # connessioni verso LAN, Pi e Internet (nginx e giochi possono parlarsi tra loro).
  giochi-net:
    driver_opts:
      com.docker.network.bridge.name: br-giochi

volumes:
  giochi-caricati:
  giochi-stato:
