server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirect con indirizzo relativo: mantiene la porta (8081) e il nome usati dal browser
    absolute_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript text/html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Giochi: basta mettere un file .html in app/giochi/files/. La pagina /giochi/ legge
    # l'elenco dei file da qui (formato JSON), senza nessuna lista da aggiornare a mano.
    location = /giochi {
        return 301 /giochi/;
    }

    location /giochi/files/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }
}
